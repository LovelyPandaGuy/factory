name: Pilot report
description: You tried the factory on your project. Tell us what happened (3 minutes).
title: "Pilot: "
labels: ["pilot"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Never paste credentials, client data or real people's details here.
  - type: dropdown
    id: os
    attributes:
      label: Your computer
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version (`node --version`)
      placeholder: v22.12.0
  - type: dropdown
    id: project
    attributes:
      label: Your project
      options: [Website, Phone app, API or backend, Script or library, Monorepo, Other]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Your AI tool
      options: [Claude Code, Codex, Gemini CLI, OpenCode, None, Other]
  - type: dropdown
    id: installed
    attributes:
      label: Did `npx @next-generation-collective/factory` run?
      options: ["Yes, in under a minute", "Yes, but slowly", "No"]
    validations:
      required: true
  - type: dropdown
    id: fixed
    attributes:
      label: Did it fix something or finish a job for you?
      options: ["Yes, and the change was right", "Yes, but the change was wrong", "It stopped part way", "I did not try", "No agent installed"]
  - type: textarea
    id: wrong
    attributes:
      label: Which line was wrong?
      description: A false alarm, a wrong count, a wrong description of your project. Copy the line.
  - type: textarea
    id: useful
    attributes:
      label: Which line was useful?
  - type: textarea
    id: next
    attributes:
      label: Where did it stop, and what did you expect to happen next?
