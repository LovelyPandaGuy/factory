name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Tests
        working-directory: cli
        run: npm test

      - name: The first run on this repository finds no proven problem
        run: node cli/bin/factory.js

      - name: The package contains what it needs
        working-directory: cli
        run: npm pack --dry-run

      - name: The Claude Code plugin carries the same factory as the package
        run: |
          node scripts/sync-plugin.mjs
          git diff --exit-code -- plugin .claude-plugin
